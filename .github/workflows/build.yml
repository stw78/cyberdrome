# SPDX-License-Identifier: GPL-3.0-or-later
# Bygger, testar och paketerar Cyberdrome på Windows. Signering via SignPath Foundation förbereds nedan
# (kräver att projektet godkänts av SignPath och att hemligheten SIGNPATH_API_TOKEN finns i repot).
name: build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    env:
      DOTNET_NOLOGO: true
      DOTNET_CLI_TELEMETRY_OPTOUT: true
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.x

      - name: Tester
        run: dotnet test tests/Cyberdrome.Tests -c Release

      - name: Android SDK-delar för våra egna appar
        shell: pwsh
        run: |
          $sdkm = Join-Path $env:ANDROID_HOME "cmdline-tools\latest\bin\sdkmanager.bat"
          "y" | & $sdkm "platforms;android-34" "build-tools;34.0.0" | Out-Null

      - name: Bygg Cyberdrome Launcher och Cyberdrome Radio
        shell: pwsh
        run: |
          foreach ($app in "CyberdromeLauncher", "CyberdromeRadio") {
            & powershell -NoProfile -ExecutionPolicy Bypass -File "android/$app/build.ps1" -Sdk $env:ANDROID_HOME -JdkPath $env:JAVA_HOME_17_X64
            if ($LASTEXITCODE -ne 0) { throw "$app misslyckades" }
          }

      - name: Velopack (vpk)
        run: dotnet tool install -g vpk --version 1.2.161

      - name: Version
        id: ver
        shell: pwsh
        run: |
          $v = if ("${{ github.ref_type }}" -eq "tag") { "${{ github.ref_name }}".TrimStart("v") } else { "1.0.0" }
          "version=$v" >> $env:GITHUB_OUTPUT

      - name: Paketera (osignerat)
        shell: pwsh
        run: powershell -NoProfile -ExecutionPolicy Bypass -File build-release.ps1 -Version ${{ steps.ver.outputs.version }} -SkipTests -Sign none

      - name: Ladda upp paketen
        id: upload
        uses: actions/upload-artifact@v4
        with:
          name: cyberdrome-${{ steps.ver.outputs.version }}
          path: release/${{ steps.ver.outputs.version }}/

      # ---- Signering (SignPath Foundation, gratis för öppen källkod) ----
      # Aktiveras när projektet är godkänt hos SignPath. Byt ut organization-id/project-slug och lägg
      # SIGNPATH_API_TOKEN som hemlighet i repot. SignPath signerar artefakten och lämnar tillbaka den signerad.
      #
      # - name: Signera med SignPath
      #   uses: signpath/github-action-submit-signing-request@v1
      #   with:
      #     api-token: ${{ secrets.SIGNPATH_API_TOKEN }}
      #     organization-id: "<signpath-organization-id>"
      #     project-slug: "cyberdrome"
      #     signing-policy-slug: "release-signing"
      #     github-artifact-id: ${{ steps.upload.outputs.artifact-id }}
      #     wait-for-completion: true
      #     output-artifact-directory: signed
