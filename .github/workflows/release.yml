# SPDX-License-Identifier: GPL-3.0-or-later
# Release: när en tagg vX.Y.Z pushas byggs, testas och paketeras Cyberdrome Cockpit, och en GitHub Release skapas
# med Setup.exe, MSI, portabel zip och Velopack-paketen som programmet uppdaterar sig från.
# Releaseanteckningarna tas från avsnittet "## X.Y.Z" i CHANGELOG.md.
name: release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    env:
      DOTNET_NOLOGO: true
      DOTNET_CLI_TELEMETRY_OPTOUT: true
      REPO_URL: https://github.com/${{ github.repository }}
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.x

      - name: Version från taggen
        id: ver
        shell: pwsh
        run: |
          $v = "${{ github.ref_name }}".TrimStart("v")
          $props = ([xml](Get-Content Directory.Build.props)).Project.PropertyGroup.Version
          if ($v -ne $props) { throw "Taggen v$v stämmer inte med <Version>$props</Version> i Directory.Build.props." }
          "version=$v" >> $env:GITHUB_OUTPUT

      - name: Tester
        run: dotnet test tests/Cyberdrome.Tests -c Release

      - name: Android SDK-delar för våra egna appar
        shell: pwsh
        run: |
          $sdkm = Join-Path $env:ANDROID_HOME "cmdline-tools\latest\bin\sdkmanager.bat"
          "y" | & $sdkm "platforms;android-34" "build-tools;34.0.0" | Out-Null

      - name: Bygg Cyberdrome Launcher och Cyberdrome Radio
        shell: pwsh
        run: |
          foreach ($app in "CyberdromeLauncher", "CyberdromeRadio") {
            & powershell -NoProfile -ExecutionPolicy Bypass -File "android/$app/build.ps1" -Sdk $env:ANDROID_HOME -JdkPath $env:JAVA_HOME_17_X64
            if ($LASTEXITCODE -ne 0) { throw "$app misslyckades" }
          }

      - name: Velopack (vpk)
        run: dotnet tool install -g vpk --version 1.2.161

      - name: Releaseanteckningar från CHANGELOG.md
        shell: pwsh
        run: powershell -NoProfile -ExecutionPolicy Bypass -File tools/changelog-section.ps1 -Version ${{ steps.ver.outputs.version }} -Out "$PWD/release-notes.md"

      - name: Hämta tidigare releaser (för delta-uppdateringar)
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force out/uppdateringar | Out-Null
          vpk download github --repoUrl $env:REPO_URL --token "${{ secrets.GITHUB_TOKEN }}" -o out/uppdateringar
          if ($LASTEXITCODE -ne 0) { Write-Host "Inga tidigare Velopack-releaser – första releasen blir ett fullt paket." }
          exit 0

      - name: Paketera
        shell: pwsh
        run: powershell -NoProfile -ExecutionPolicy Bypass -File build-release.ps1 -Version ${{ steps.ver.outputs.version }} -SkipTests -Sign none -OutRoot "$PWD/out" -ReleaseNotes "$PWD/release-notes.md"

      - name: Publicera GitHub Release
        shell: pwsh
        run: |
          $v = "${{ steps.ver.outputs.version }}"
          vpk upload github --repoUrl $env:REPO_URL --token "${{ secrets.GITHUB_TOKEN }}" -o out/uppdateringar `
            --publish --releaseName "Cyberdrome Cockpit $v" --tag "v$v" --merge
          if ($LASTEXITCODE -ne 0) { throw "vpk upload github misslyckades" }

      - name: Lägg till MSI och licenstexter
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $v = "${{ steps.ver.outputs.version }}"
          $files = Get-ChildItem "out/$v" -File | Where-Object { $_.Extension -in ".msi" } | ForEach-Object FullName
          if ($files) { gh release upload "v$v" @files --clobber --repo "${{ github.repository }}" }
          gh release view "v$v" --repo "${{ github.repository }}" --json assets --jq '.assets[].name'

      - name: Spara paketen som artefakt
        uses: actions/upload-artifact@v6
        with:
          name: cyberdrome-cockpit-${{ steps.ver.outputs.version }}
          path: out/${{ steps.ver.outputs.version }}/
          if-no-files-found: error

  # Linux: samma version som AppImage och uppdateringspaket (kanalen "linux") i samma GitHub-release.
  release-linux:
    needs: release
    runs-on: ubuntu-latest
    env:
      DOTNET_NOLOGO: true
      DOTNET_CLI_TELEMETRY_OPTOUT: true
      REPO_URL: https://github.com/${{ github.repository }}
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.x

      - name: Velopack (vpk)
        run: dotnet tool install -g vpk --version 1.2.161

      - name: Releaseanteckningar och tidigare Linux-releaser
        run: |
          v="${GITHUB_REF_NAME#v}"
          echo "VERSION=$v" >> "$GITHUB_ENV"
          pwsh -NoProfile -File tools/changelog-section.ps1 -Version "$v" -Out "$PWD/release-notes.md"
          mkdir -p out/uppdateringar-linux
          vpk download github --repoUrl "$REPO_URL" --token "${{ secrets.GITHUB_TOKEN }}" --channel linux -o out/uppdateringar-linux || echo "Inga tidigare Linux-releaser."

      - name: Bygg och paketera
        run: RELEASE_NOTES="$PWD/release-notes.md" bash tools/build-linux.sh "$VERSION" "$PWD/out"

      - name: Lägg till i GitHub-releasen
        run: |
          vpk upload github --repoUrl "$REPO_URL" --token "${{ secrets.GITHUB_TOKEN }}" -o out/uppdateringar-linux \
            --channel linux --publish --merge --releaseName "Cyberdrome Cockpit $VERSION" --tag "v$VERSION"

      # SHA-256-kontrollsummor för alla filer i releasen (Windows och Linux), så att den som laddar ner kan kontrollera
      # filerna: Get-FileHash -Algorithm SHA256 <fil> (Windows) eller sha256sum -c SHA256SUMS.txt --ignore-missing (Linux).
      - name: SHA256SUMS.txt
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mkdir -p out/sums && cd out/sums
          gh release download "v$VERSION" --repo "${{ github.repository }}" --pattern '*' --skip-existing
          rm -f SHA256SUMS.txt
          sha256sum -- * | sort -k2 > ../SHA256SUMS.txt
          cat ../SHA256SUMS.txt
          gh release upload "v$VERSION" ../SHA256SUMS.txt --clobber --repo "${{ github.repository }}"
